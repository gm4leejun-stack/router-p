services:
  router-p:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ROUTER_P_PORT:-8000}:${ROUTER_P_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % __import__('os').environ.get('ROUTER_P_PORT', '8000'))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
